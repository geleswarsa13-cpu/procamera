<!DOCTYPE html>
<html lang="en">
<head>
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-5166654007305843"
     crossorigin="anonymous"></script>
<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0, maximum-scale=1.0"
>

<title>Question AI</title>

<meta
  name="description"
  content="Question AI - Solve questions using text or images."
>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f4f5fb;
  color: #151515;
}

header {
  background: linear-gradient(135deg,#6d28d9,#9333ea);
  color: white;
  padding: 24px 18px;
  text-align: center;
}

header h1 {
  margin: 0;
  font-size: 30px;
}

header p {
  margin: 7px 0 0;
  opacity: .9;
}

.container {
  width: 100%;
  max-width: 720px;
  margin: auto;
  padding: 16px;
}

.card {
  background: white;
  border-radius: 18px;
  padding: 16px;
  margin-bottom: 15px;
  box-shadow: 0 5px 20px rgba(0,0,0,.07);
}

label {
  display: block;
  font-weight: bold;
  margin-bottom: 8px;
}

textarea {
  width: 100%;
  min-height: 130px;
  border: 1px solid #ddd;
  border-radius: 13px;
  padding: 13px;
  font-size: 16px;
  resize: vertical;
  outline: none;
}

textarea:focus {
  border-color: #7c3aed;
}

.subjects,
.options {
  display: flex;
  gap: 8px;
  overflow-x: auto;
  padding-bottom: 5px;
}

.subject-btn,
.option-btn {
  border: 0;
  background: #eee;
  padding: 10px 14px;
  border-radius: 20px;
  white-space: nowrap;
  cursor: pointer;
}

.subject-btn.active,
.option-btn.active {
  background: #7c3aed;
  color: white;
}

.upload {
  display: block;
  border: 2px dashed #bbb;
  border-radius: 15px;
  padding: 18px;
  text-align: center;
  cursor: pointer;
}

.upload input {
  display: none;
}

#preview {
  display: none;
  width: 100%;
  max-height: 350px;
  object-fit: contain;
  border-radius: 14px;
  margin-top: 12px;
  background: #f2f2f2;
}

.solve-btn {
  width: 100%;
  border: 0;
  border-radius: 15px;
  padding: 16px;
  font-size: 18px;
  font-weight: bold;
  color: white;
  background: linear-gradient(135deg,#7c3aed,#9333ea);
  cursor: pointer;
}

.solve-btn:disabled {
  opacity: .6;
}

.status {
  display: none;
  text-align: center;
  padding: 15px;
}

.spinner {
  width: 25px;
  height: 25px;
  border: 3px solid #ddd;
  border-top-color: #7c3aed;
  border-radius: 50%;
  animation: spin 1s linear infinite;
  margin: auto;
}

@keyframes spin {
  to {
    transform: rotate(360deg);
  }
}

.answer {
  display: none;
}

.answer-text {
  white-space: pre-wrap;
  line-height: 1.65;
  font-size: 16px;
}

.actions {
  display: flex;
  gap: 8px;
  margin-top: 15px;
}

.action-btn {
  flex: 1;
  border: 0;
  padding: 12px;
  border-radius: 12px;
  cursor: pointer;
  background: #eee;
}

.history-item {
  padding: 12px;
  border-bottom: 1px solid #eee;
}

.history-item:last-child {
  border-bottom: 0;
}

.history-question {
  font-weight: bold;
  margin-bottom: 5px;
}

.small {
  font-size: 13px;
  color: #666;
}

footer {
  text-align: center;
  padding: 25px 10px;
  color: #666;
  font-size: 13px;
}

footer button {
  border: 0;
  background: none;
  color: #6d28d9;
  cursor: pointer;
  margin: 3px;
}
</style>
</head>

<body>

<header>
  <h1>Question AI</h1>
  <p>Ask questions. Upload images. Get AI answers.</p>
</header>

<div class="container">

  <div class="card">

    <label>Subject</label>

    <div class="subjects">
      <button class="subject-btn active"
        onclick="selectSubject(this,'Auto')">Auto</button>

      <button class="subject-btn"
        onclick="selectSubject(this,'Maths')">Maths</button>

      <button class="subject-btn"
        onclick="selectSubject(this,'Physics')">Physics</button>

      <button class="subject-btn"
        onclick="selectSubject(this,'Chemistry')">Chemistry</button>

      <button class="subject-btn"
        onclick="selectSubject(this,'Biology')">Biology</button>

      <button class="subject-btn"
        onclick="selectSubject(this,'Hindi')">Hindi</button>

      <button class="subject-btn"
        onclick="selectSubject(this,'English')">English</button>
    </div>

  </div>


  <div class="card">

    <label>Your Question</label>

    <textarea
      id="question"
      placeholder="Type your question here..."
    ></textarea>

  </div>


  <div class="card">

    <label>Upload Question Image</label>

    <label class="upload">
      📷 Tap here to upload image
      <br>
      <span class="small">
        JPG, PNG, WEBP, HEIC supported
      </span>

      <input
        id="imageInput"
        type="file"
        accept="image/*,.heic,.heif"
        onchange="handleImage(event)"
      >
    </label>

    <img id="preview">

  </div>


  <div class="card">

    <label>Answer Language</label>

    <div class="options">

      <button
        class="option-btn active"
        onclick="selectLanguage(this,'Hindi')"
      >Hindi</button>

      <button
        class="option-btn"
        onclick="selectLanguage(this,'English')"
      >English</button>

      <button
        class="option-btn"
        onclick="selectLanguage(this,'Hinglish')"
      >Hinglish</button>

    </div>

    <br>

    <label>Level</label>

    <div class="options">

      <button
        class="option-btn active"
        onclick="selectLevel(this,'School')"
      >School</button>

      <button
        class="option-btn"
        onclick="selectLevel(this,'Class 6-8')"
      >6-8</button>

      <button
        class="option-btn"
        onclick="selectLevel(this,'Class 9-10')"
      >9-10</button>

      <button
        class="option-btn"
        onclick="selectLevel(this,'Class 11-12')"
      >11-12</button>

      <button
        class="option-btn"
        onclick="selectLevel(this,'College')"
      >College</button>

    </div>

  </div>


  <div class="card">

    <button
      id="solveButton"
      class="solve-btn"
      onclick="solveQuestion()"
    >
      ✨ Solve Question
    </button>

    <div id="status" class="status">

      <div class="spinner"></div>

      <p>AI is solving your question...</p>

    </div>

  </div>


  <div id="answerCard" class="card answer">

    <label>Answer</label>

    <div
      id="answerText"
      class="answer-text"
    ></div>

    <div class="actions">

      <button
        class="action-btn"
        onclick="copyAnswer()"
      >
        📋 Copy
      </button>

      <button
        class="action-btn"
        onclick="speakAnswer()"
      >
        🔊 Speak
      </button>

    </div>

  </div>


  <div class="card">

    <label>Recent History</label>

    <div id="history">
      <div class="small">
        Your solved questions will appear here.
      </div>
    </div>

    <br>

    <button
      class="action-btn"
      onclick="clearHistory()"
    >
      Clear History
    </button>

  </div>

</div>


<footer>

  <div>
    © 2026 Question AI
  </div>

  <div>

    <button onclick="showInfo('About')">
      About
    </button>

    <button onclick="showInfo('Contact')">
      Contact
    </button>

    <button onclick="showInfo('Privacy Policy')">
      Privacy
    </button>

    <button onclick="showInfo('Terms')">
      Terms
    </button>

  </div>

</footer>


<script src="https://cdn.jsdelivr.net/npm/heic2any@0.0.4/dist/heic2any.min.js"></script>

<script>

let selectedSubject = "Auto";
let selectedLanguage = "Hindi";
let selectedLevel = "School";

let imageBase64 = "";
let imageMime = "";

let currentAnswer = "";


function selectSubject(button, value) {

  document
    .querySelectorAll(".subject-btn")
    .forEach(b => b.classList.remove("active"));

  button.classList.add("active");

  selectedSubject = value;
}


function selectLanguage(button, value) {

  document
    .querySelectorAll(".card:nth-of-type(4) .option-btn")
    .forEach(b => b.classList.remove("active"));

  button.classList.add("active");

  selectedLanguage = value;
}


function selectLevel(button, value) {

  const buttons =
    document.querySelectorAll(".option-btn");

  buttons.forEach(b => {

    if (
      ["School","6-8","9-10","11-12","College"]
      .includes(b.innerText)
    ) {
      b.classList.remove("active");
    }

  });

  button.classList.add("active");

  selectedLevel = value;
}


async function handleImage(event) {

  const file = event.target.files[0];

  if (!file) return;

  try {

    let inputFile = file;

    const name =
      file.name.toLowerCase();

    if (
      name.endsWith(".heic") ||
      name.endsWith(".heif")
    ) {

      if (
        typeof heic2any === "undefined"
      ) {
        throw new Error(
          "HEIC converter load nahi hua."
        );
      }

      const converted =
        await heic2any({
          blob: file,
          toType: "image/jpeg",
          quality: 0.85
        });

      inputFile =
        Array.isArray(converted)
          ? converted[0]
          : converted;
    }


    const reader =
      new FileReader();

    reader.onload = function(e) {

      const img =
        new Image();

      img.onload = function() {

        const maxSize = 1600;

        let width = img.width;
        let height = img.height;

        if (width > maxSize || height > maxSize) {

          const scale =
            Math.min(
              maxSize / width,
              maxSize / height
            );

          width =
            Math.round(width * scale);

          height =
            Math.round(height * scale);
        }

        const canvas =
          document.createElement("canvas");

        canvas.width = width;
        canvas.height = height;

        const ctx =
          canvas.getContext("2d");

        ctx.drawImage(
          img,
          0,
          0,
          width,
          height
        );

        const compressed =
          canvas.toDataURL(
            "image/jpeg",
            0.82
          );

        imageBase64 =
          compressed.split(",")[1];

        imageMime =
          "image/jpeg";

        const preview =
          document.getElementById("preview");

        preview.src =
          compressed;

        preview.style.display =
          "block";
      };

      img.src = e.target.result;
    };

    reader.readAsDataURL(inputFile);

  } catch (error) {

    alert(
      "Image process nahi ho payi: " +
      error.message
    );

  }
}


function cleanAIAnswer(text) {

  if (!text) return "";

  return text
    .replace(/```[\s\S]*?```/g, "")
    .replace(/\$\$([\s\S]*?)\$\$/g, "$1")
    .replace(/\$([^$]+)\$/g, "$1")
    .replace(/\\frac/g, "fraction")
    .replace(/\\sqrt/g, "√")
    .replace(/\\times/g, "×")
    .replace(/\\div/g, "÷")
    .replace(/\\cdot/g, "·")
    .replace(/\\approx/g, "≈")
    .trim();
}


async function solveQuestion() {

  const question =
    document
      .getElementById("question")
      .value
      .trim();

  if (!question && !imageBase64) {

    alert(
      "Question likho ya image upload karo."
    );

    return;
  }

  const solveButton =
    document.getElementById("solveButton");

  const status =
    document.getElementById("status");

  const answerCard =
    document.getElementById("answerCard");

  const answerText =
    document.getElementById("answerText");

  solveButton.disabled = true;

  status.style.display =
    "block";

  answerCard.style.display =
    "none";

  try {

    const instruction = `
You are Question AI, a helpful educational tutor.

Subject: ${selectedSubject}
Student level: ${selectedLevel}
Answer language: ${selectedLanguage}

Solve the student's question accurately.

If an image is attached:
- Read the question from the image.
- Solve exactly what is visible.
- Do not invent missing information.

For mathematics/science:
- Show clear steps.
- Explain formulas simply.
- Give the final answer clearly.

For other subjects:
- Give a clear, understandable explanation.

Do not mention that you are an AI.
Do not ask for an API key.
Keep the answer educational and easy to understand.

Student question:
${question || "(Question is in the uploaded image)"}
`;

    const parts = [
      {
        text: instruction
      }
    ];


    if (imageBase64) {

      parts.push({

        inline_data: {

          mime_type:
            imageMime,

          data:
            imageBase64

        }

      });

    }


    const response =
      await fetch(
        "/api/gemini",
        {
          method: "POST",

          headers: {
            "Content-Type":
              "application/json"
          },

          body:
            JSON.stringify({
              contents: [
                {
                  role: "user",
                  parts: parts
                }
              ]
            })
        }
      );


    const data =
      await response.json();


    if (!response.ok) {

      const message =
        data?.error?.message ||
        data?.error ||
        "AI request failed.";

      throw new Error(message);
    }


    const generatedParts =
      data?.candidates?.[0]?.content?.parts || [];


    const result =
      generatedParts
        .map(part => part.text || "")
        .join("\n")
        .trim();


    if (!result) {

      throw new Error(
        "AI ne koi answer return nahi kiya."
      );

    }


    currentAnswer =
      cleanAIAnswer(result);

    answerText.innerText =
      currentAnswer;

    answerCard.style.display =
      "block";

    saveHistory(
      question ||
      "Image question",
      currentAnswer
    );

    window.scrollTo({
      top:
        answerCard.offsetTop - 20,
      behavior:
        "smooth"
    });


  } catch (error) {

    currentAnswer = "";

    answerText.innerText =
      "Error: " +
      error.message;

    answerCard.style.display =
      "block";

  } finally {

    solveButton.disabled =
      false;

    status.style.display =
      "none";
  }
}


async function copyAnswer() {

  if (!currentAnswer) return;

  try {

    await navigator.clipboard.writeText(
      currentAnswer
    );

    alert("Answer copied!");

  } catch {

    alert(
      "Copy nahi ho paya."
    );

  }
}


function speakAnswer() {

  if (!currentAnswer) return;

  window.speechSynthesis.cancel();

  const speech =
    new SpeechSynthesisUtterance(
      currentAnswer
    );

  speech.lang =
    selectedLanguage === "Hindi"
      ? "hi-IN"
      : "en-IN";

  speech.rate = 0.9;

  window.speechSynthesis.speak(
    speech
  );
}


function saveHistory(question, answer) {

  let history =
    JSON.parse(
      localStorage.getItem(
        "questionAIHistory"
      ) || "[]"
    );

  history.unshift({
    question: question,
    answer: answer,
    time: new Date().toLocaleString()
  });

  history =
    history.slice(0, 10);

  localStorage.setItem(
    "questionAIHistory",
    JSON.stringify(history)
  );

  renderHistory();
}


function renderHistory() {

  const container =
    document.getElementById("history");

  let history =
    JSON.parse(
      localStorage.getItem(
        "questionAIHistory"
      ) || "[]"
    );

  if (!history.length) {

    container.innerHTML =
      '<div class="small">Your solved questions will appear here.</div>';

    return;
  }

  container.innerHTML =
    history.map(item => `

      <div class="history-item">

        <div class="history-question">
          ${escapeHTML(item.question)}
        </div>

        <div class="small">
          ${escapeHTML(item.time)}
        </div>

      </div>

    `).join("");
}


function clearHistory() {

  localStorage.removeItem(
    "questionAIHistory"
  );

  renderHistory();
}


function escapeHTML(text) {

  return String(text)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}


function showInfo(title) {

  const pages = {

    "About":
      "Question AI helps students solve questions using text and images.",

    "Contact":
      "Contact: Add your support email here before publishing.",

    "Privacy Policy":
      "Question AI processes submitted questions to provide answers. Do not upload sensitive personal information.",

    "Terms":
      "Question AI is an educational assistance tool. Always verify important answers with a teacher or trusted source."

  };

  alert(
    title +
    "\n\n" +
    pages[title]
  );
}


renderHistory();

</script>

</body>
</html>
