<script>

let imageMime = "";


// =========================
// HEIC CONVERTER LOADER
// =========================

function loadHEICConverter(){

  return new Promise(function(resolve,reject){

    if(typeof heic2any !== "undefined"){

      resolve();

      return;

    }

    const script =
      document.createElement("script");

    script.src =
      "https://cdn.jsdelivr.net/npm/heic2any@0.0.4/dist/heic2any.min.js";

    script.onload =
      function(){

        resolve();

      };

    script.onerror =
      function(){

        reject(
          new Error(
            "HEIC converter load nahi hua."
          )
        );

      };

    document.head.appendChild(
      script
    );

  });

}


// =========================
// PAGE NAVIGATION
// =========================

function showPage(pageId){

  document.getElementById("mainPage").style.display = "none";

  document.getElementById("aboutPage").style.display = "none";

  document.getElementById("contactPage").style.display = "none";

  document.getElementById("privacyPage").style.display = "none";

  document.getElementById("termsPage").style.display = "none";

  document.getElementById(pageId).style.display = "block";

  window.scrollTo(0,0);

}


function showMain(){

  document.getElementById("mainPage").style.display = "block";

  document.getElementById("aboutPage").style.display = "none";

  document.getElementById("contactPage").style.display = "none";

  document.getElementById("privacyPage").style.display = "none";

  document.getElementById("termsPage").style.display = "none";

  window.scrollTo(0,0);

}


// =========================
// TOAST
// =========================

function showToast(message){

  const toast =
    document.getElementById("toast");

  if(!toast){

    return;

  }

  toast.innerText =
    message;

  toast.style.display =
    "block";


  setTimeout(function(){

    toast.style.display =
      "none";

  },3000);

}


// =========================
// SUBJECT
// =========================

function selectSubject(button,subject){

  selectedSubject =
    subject;


  document
    .querySelectorAll(".subjects button")
    .forEach(function(btn){

      btn.classList.remove(
        "active"
      );

    });


  button.classList.add(
    "active"
  );

}


// =========================
// IMAGE UPLOAD
// HEIC / HEIF SUPPORT
// =========================

async function handleImage(event){

  const file =
    event.target.files[0];


  if(!file){

    imageBase64 = "";

    imageMime = "";

    return;

  }


  try{

    let uploadFile =
      file;


    const fileName =
      file.name.toLowerCase();


    const isHEIC =
      fileName.endsWith(".heic") ||
      fileName.endsWith(".heif") ||
      file.type === "image/heic" ||
      file.type === "image/heif";


    // =========================
    // HEIC → JPEG
    // =========================

    if(isHEIC){

      showToast(
        "HEIC photo convert ho rahi hai..."
      );


      await loadHEICConverter();


      const converted =
        await heic2any({

          blob:
            file,

          toType:
            "image/jpeg",

          quality:
            0.82

        });


      uploadFile =
        Array.isArray(converted)
          ? converted[0]
          : converted;

    }


    // =========================
    // NORMAL IMAGE CHECK
    // =========================

    if(
      !isHEIC &&
      !file.type.startsWith("image/")
    ){

      showToast(
        "Sirf image upload karo"
      );

      event.target.value =
        "";

      return;

    }


    // =========================
    // FILE READER
    // =========================

    const reader =
      new FileReader();


    reader.onload =
      function(e){

        const img =
          new Image();


        img.onload =
          function(){

            const maxSize =
              1600;


            let width =
              img.width;

            let height =
              img.height;


            // =========================
            // RESIZE IMAGE
            // =========================

            if(
              width > maxSize ||
              height > maxSize
            ){

              if(width > height){

                height =
                  Math.round(
                    height *
                    maxSize /
                    width
                  );

                width =
                  maxSize;

              }else{

                width =
                  Math.round(
                    width *
                    maxSize /
                    height
                  );

                height =
                  maxSize;

              }

            }


            // =========================
            // CANVAS
            // =========================

            const canvas =
              document.createElement(
                "canvas"
              );


            canvas.width =
              width;

            canvas.height =
              height;


            const ctx =
              canvas.getContext(
                "2d"
              );


            ctx.drawImage(
              img,
              0,
              0,
              width,
              height
            );


            // =========================
            // COMPRESS AS JPEG
            // =========================

            const compressed =
              canvas.toDataURL(
                "image/jpeg",
                0.82
              );


            imageBase64 =
              compressed.split(",")[1];


            imageMime =
              "image/jpeg";


            // =========================
            // PREVIEW
            // =========================

            const preview =
              document.getElementById(
                "preview"
              );


            if(preview){

              preview.src =
                compressed;

              preview.style.display =
                "block";

            }


            showToast(
              "Image ready ✓"
            );

          };


        img.onerror =
          function(){

            imageBase64 = "";

            imageMime = "";

            showToast(
              "Photo read nahi ho paayi. JPG ya PNG try karo."
            );

          };


        img.src =
          e.target.result;

      };


    reader.onerror =
      function(){

        imageBase64 = "";

        imageMime = "";

        showToast(
          "Photo read nahi ho paayi."
        );

      };


    reader.readAsDataURL(
      uploadFile
    );


  }catch(error){

    console.error(
      "Image upload error:",
      error
    );


    imageBase64 = "";

    imageMime = "";


    showToast(
      "HEIC photo convert nahi ho paayi. JPG/PNG try karo."
    );


    event.target.value =
      "";

  }

}


// =========================
// CLEAN AI ANSWER
// =========================

function cleanAIAnswer(text){

  if(!text){

    return "";

  }


  return text

    .replace(
      /```[a-zA-Z]*\n?/g,
      ""
    )

    .replace(
      /```/g,
      ""
    )

    .replace(
      /\$\$/g,
      ""
    )

    .replace(
      /\$/g,
      ""
    )

    .replace(
      /\*\*/g,
      ""
    )

    .replace(
      /\*/g,
      ""
    )

    .replace(
      /^#{1,6}\s*/gm,
      ""
    )

    .replace(
      /\\text\{([^}]*)\}/g,
      "$1"
    )

    .replace(
      /\\mathrm\{([^}]*)\}/g,
      "$1"
    )

    .replace(
      /\\mathbf\{([^}]*)\}/g,
      "$1"
    )

    .replace(
      /\\frac\{([^}]*)\}\{([^}]*)\}/g,
      "$1/$2"
    )

    .replace(
      /\\quad/g,
      " "
    )

    .replace(
      /\\qquad/g,
      " "
    )

    .replace(
      /\\,/g,
      " "
    )

    .replace(
      /\\;/g,
      " "
    )

    .replace(
      /\\!/g,
      ""
    )

    .replace(
      /\\left/g,
      ""
    )

    .replace(
      /\\right/g,
      ""
    )

    .replace(
      /\\begin\{[^}]*\}/g,
      ""
    )

    .replace(
      /\\end\{[^}]*\}/g,
      ""
    )

    .replace(
      /[ \t]+/g,
      " "
    )

    .replace(
      /\n{3,}/g,
      "\n\n"
    )

    .trim();

}


// =========================
// SOLVE QUESTION
// =========================

async function solveQuestion(){

  const question =
    document
      .getElementById("question")
      .value
      .trim();


  const language =
    document
      .getElementById("language")
      .value;


  const level =
    document
      .getElementById("level")
      .value;


  if(
    !question &&
    !imageBase64
  ){

    showToast(
      "Question ya image do"
    );

    return;

  }


  const status =
    document.getElementById(
      "status"
    );


  const answerCard =
    document.getElementById(
      "answerCard"
    );


  const answer =
    document.getElementById(
      "answer"
    );


  const solveBtn =
    document.getElementById(
      "solveBtn"
    );


  status.style.display =
    "block";


  answerCard.style.display =
    "none";


  solveBtn.disabled =
    true;


  const instruction = `

You are Question AI, a helpful educational assistant.

Subject:
${selectedSubject}

Student level:
${level}

Answer language:
${language}

Rules:

1. Solve the student's question accurately.

2. If it is a maths or science problem,
show the method step by step.

3. Explain formulas clearly.

4. Keep the explanation easy to understand.

5. If an image is provided,
carefully read the question from the image.

6. Do not invent information that is not visible in the image.

7. Give the final answer clearly at the end.

8. For Hindi use simple Hindi.

9. For Hinglish use easy Hindi written with English letters.

10. Do not unnecessarily make the answer extremely long.

11. Use plain text only.

12. NEVER use $ or $$.

13. NEVER use LaTeX.

14. NEVER use Markdown bold using **.

15. NEVER use Markdown headings using #.

16. NEVER use \\frac, \\quad, \\begin or \\end.

17. Write mathematical calculations in simple plain text.

18. Example:
23 + 2 = 25

19. Do not put the answer inside a code block.

20. Do not use complicated formatting.

21. Make the final answer easy to read on a mobile phone.

Student question:

${question || "Please solve the question shown in the uploaded image."}

`;


  try{

    const parts = [

      {
        text:
          instruction
      }

    ];


    // =========================
    // ADD IMAGE
    // =========================

    if(imageBase64){

      parts.push({

        inline_data:{

          mime_type:
            imageMime,

          data:
            imageBase64

        }

      });

    }


    // =========================
    // VERCEL API
    // =========================

    const response =
      await fetch(
        "/api/gemini",
        {

          method:
            "POST",

          headers:{

            "Content-Type":
              "application/json"

          },

          body:
            JSON.stringify({

              contents:[

                {

                  role:
                    "user",

                  parts:
                    parts

                }

              ]

            })

        }
      );


    let data;


    try{

      data =
        await response.json();

    }catch(e){

      throw new Error(
        "Server ne valid response nahi diya."
      );

    }


    if(!response.ok){

      let message =
        "Gemini API error";


      if(
        data &&
        data.error
      ){

        if(
          typeof data.error ===
          "string"
        ){

          message =
            data.error;

        }else if(
          data.error.message
        ){

          message =
            data.error.message;

        }

      }


      throw new Error(
        message
      );

    }


    let result =
      "";


    if(
      data &&
      data.candidates &&
      data.candidates[0] &&
      data.candidates[0].content &&
      data.candidates[0].content.parts
    ){

      data.candidates[0]
        .content
        .parts
        .forEach(
          function(part){

            if(part.text){

              result +=
                part.text;

            }

          }
        );

    }


    if(!result){

      throw new Error(
        "AI ne koi answer return nahi kiya."
      );

    }


    const cleanResult =
      cleanAIAnswer(
        result
      );


    answer.innerText =
      cleanResult;


    answerCard.style.display =
      "block";


  }catch(error){

    console.error(
      "Question AI Error:",
      error
    );


    answer.innerText =
      "Error: " +
      (
        error.message ||
        "Request failed"
      );


    answerCard.style.display =
      "block";

  }


  status.style.display =
    "none";


  solveBtn.disabled =
    false;

}


// =========================
// COPY ANSWER
// =========================

function copyAnswer(){

  const text =
    document
      .getElementById(
        "answer"
      )
      .innerText;


  if(!text){

    return;

  }


  if(
    navigator.clipboard &&
    navigator.clipboard.writeText
  ){

    navigator.clipboard
      .writeText(text)
      .then(function(){

        showToast(
          "Answer copy ho gaya ✓"
        );

      })
      .catch(function(){

        showToast(
          "Copy nahi ho paya"
        );

      });

  }else{

    showToast(
      "Copy supported nahi hai"
    );

  }

}


// =========================
// SPEAK
// =========================

function speakAnswer(){

  const text =
    document
      .getElementById(
        "answer"
      )
      .innerText;


  if(!text){

    return;

  }


  if(
    !("speechSynthesis" in window)
  ){

    showToast(
      "Speech browser me supported nahi hai"
    );

    return;

  }


  window.speechSynthesis.cancel();


  const speech =
    new SpeechSynthesisUtterance(
      text
    );


  speech.rate =
    0.9;


  window.speechSynthesis.speak(
    speech
  );

}

  </script>
