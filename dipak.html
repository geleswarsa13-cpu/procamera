<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Question AI</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,Helvetica,sans-serif;
  background:#f4f6fb;
  color:#151515;
}

.app{
  width:100%;
  max-width:700px;
  margin:auto;
  min-height:100vh;
  background:white;
}

/* HEADER */
.header{
  background:linear-gradient(135deg,#6d35d9,#8b55e8);
  color:white;
  padding:20px 18px;
  text-align:center;
}

.header h1{
  font-size:27px;
  margin-bottom:5px;
}

.header p{
  font-size:14px;
  opacity:.9;
}

/* API KEY */
.api-box{
  padding:15px;
  background:#fafafa;
  border-bottom:1px solid #eee;
}

.api-box input{
  width:100%;
  padding:13px;
  border:1px solid #ddd;
  border-radius:10px;
  outline:none;
  font-size:14px;
  margin-bottom:8px;
}

.save-btn{
  width:100%;
  border:0;
  background:#222;
  color:white;
  padding:12px;
  border-radius:9px;
  font-weight:bold;
}

/* SUBJECT */
.section{
  padding:15px;
}

.section-title{
  font-size:14px;
  font-weight:bold;
  margin-bottom:10px;
}

.subjects{
  display:flex;
  gap:8px;
  overflow-x:auto;
  padding-bottom:4px;
}

.subjects button{
  flex-shrink:0;
  border:1px solid #ddd;
  background:white;
  padding:9px 13px;
  border-radius:20px;
  font-size:13px;
}

.subjects button.active{
  background:#743bd8;
  color:white;
  border-color:#743bd8;
}

/* QUESTION */
.question-box{
  margin:0 15px 15px;
  border:1px solid #ddd;
  border-radius:14px;
  overflow:hidden;
  background:white;
}

.question-box textarea{
  width:100%;
  min-height:130px;
  border:0;
  outline:0;
  resize:vertical;
  padding:15px;
  font-size:16px;
  font-family:inherit;
}

.controls{
  display:flex;
  gap:8px;
  padding:10px;
  border-top:1px solid #eee;
}

.controls button{
  flex:1;
  padding:11px;
  border:0;
  border-radius:9px;
  background:#f0f0f0;
}

/* IMAGE */
.image-area{
  margin:0 15px 15px;
}

.image-label{
  display:block;
  text-align:center;
  padding:13px;
  background:#f0ebff;
  color:#6330c7;
  border-radius:11px;
  font-weight:bold;
}

#imageInput{
  display:none;
}

#imagePreview{
  display:none;
  width:100%;
  max-height:260px;
  object-fit:contain;
  margin-top:10px;
  border-radius:12px;
  border:1px solid #ddd;
}

/* OPTIONS */
.options{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  padding:0 15px 15px;
}

.options select{
  width:100%;
  padding:12px;
  border:1px solid #ddd;
  border-radius:10px;
  background:white;
}

/* SOLVE */
.solve-btn{
  margin:0 15px 15px;
  width:calc(100% - 30px);
  padding:15px;
  border:0;
  border-radius:12px;
  background:linear-gradient(135deg,#6d35d9,#8b55e8);
  color:white;
  font-size:17px;
  font-weight:bold;
}

.solve-btn:disabled{
  opacity:.6;
}

/* LOADING */
.loading{
  display:none;
  text-align:center;
  padding:20px;
}

.spinner{
  width:30px;
  height:30px;
  border:4px solid #ddd;
  border-top-color:#743bd8;
  border-radius:50%;
  animation:spin 1s linear infinite;
  margin:auto auto 10px;
}

@keyframes spin{
  to{transform:rotate(360deg)}
}

/* ANSWER */
.answer-card{
  display:none;
  margin:0 15px 15px;
  border:1px solid #ddd;
  border-radius:14px;
  overflow:hidden;
  background:white;
}

.answer-title{
  padding:13px 15px;
  background:#f5f1ff;
  color:#6330c7;
  font-weight:bold;
}

.answer{
  padding:16px;
  white-space:pre-wrap;
  line-height:1.65;
  font-size:15px;
  overflow-wrap:anywhere;
}

.answer-actions{
  display:flex;
  gap:8px;
  padding:10px;
  border-top:1px solid #eee;
}

.answer-actions button{
  flex:1;
  padding:11px;
  border:0;
  border-radius:9px;
  background:#f0f0f0;
}

/* AD */
.ad-box{
  margin:10px 15px 20px;
  padding:10px;
  min-height:100px;
  text-align:center;
  border:1px solid #eee;
  border-radius:12px;
  background:#fafafa;
}

.ad-title{
  font-size:11px;
  color:#999;
  margin-bottom:5px;
}

/* TOAST */
.toast{
  position:fixed;
  left:50%;
  bottom:20px;
  transform:translateX(-50%);
  background:#222;
  color:white;
  padding:11px 16px;
  border-radius:9px;
  display:none;
  z-index:9999;
  font-size:14px;
}

/* FOOTER */
.footer{
  text-align:center;
  color:#999;
  font-size:12px;
  padding:20px;
}

@media(max-width:450px){
  .header h1{
    font-size:24px;
  }

  .options{
    grid-template-columns:1fr;
  }
}
</style>
</head>

<body>

<div class="app">

  <!-- HEADER -->
  <div class="header">
    <h1>Question AI</h1>
    <p>Ask questions • Upload image • Get step-by-step answers</p>
  </div>

  <!-- API KEY -->
  <div class="api-box">
    <input
      type="password"
      id="apiKey"
      placeholder="Apni Gemini API key yahan paste karo"
    >

    <button class="save-btn" onclick="saveKey()">
      Save API Key
    </button>
  </div>

  <!-- SUBJECT -->
  <div class="section">
    <div class="section-title">Select Subject</div>

    <div class="subjects">

      <button class="active" onclick="selectSubject(this,'Auto')">
        Auto
      </button>

      <button onclick="selectSubject(this,'Maths')">
        Maths
      </button>

      <button onclick="selectSubject(this,'Physics')">
        Physics
      </button>

      <button onclick="selectSubject(this,'Chemistry')">
        Chemistry
      </button>

      <button onclick="selectSubject(this,'Biology')">
        Biology
      </button>

      <button onclick="selectSubject(this,'Hindi')">
        Hindi
      </button>

      <button onclick="selectSubject(this,'English')">
        English
      </button>

    </div>
  </div>

  <!-- QUESTION -->
  <div class="question-box">

    <textarea
      id="question"
      placeholder="Apna question yahan likho..."
    ></textarea>

    <div class="controls">
      <button onclick="clearQuestion()">Clear</button>
      <button onclick="pasteQuestion()">Paste</button>
    </div>

  </div>

  <!-- IMAGE -->
  <div class="image-area">

    <label class="image-label" for="imageInput">
      📷 Upload Question Image
    </label>

    <input
      type="file"
      id="imageInput"
      accept="image/*"
    >

    <img id="imagePreview">

  </div>

  <!-- OPTIONS -->
  <div class="options">

    <select id="language">
      <option value="Hindi">Hindi</option>
      <option value="English">English</option>
      <option value="Hinglish">Hinglish</option>
    </select>

    <select id="level">
      <option value="School">School</option>
      <option value="Class 6-8">Class 6-8</option>
      <option value="Class 9-10">Class 9-10</option>
      <option value="Class 11-12">Class 11-12</option>
      <option value="College">College</option>
    </select>

  </div>

  <!-- SOLVE -->
  <button
    class="solve-btn"
    id="solveBtn"
    onclick="solveQuestion()"
  >
    ✨ Solve Question
  </button>

  <!-- LOADING -->
  <div class="loading" id="loading">

    <div class="spinner"></div>

    <div>AI answer bana raha hai...</div>

  </div>

  <!-- ANSWER -->
  <div class="answer-card" id="answerCard">

    <div class="answer-title">
      🤖 Answer
    </div>

    <div class="answer" id="answer"></div>

    <div class="answer-actions">

      <button onclick="copyAnswer()">
        📋 Copy
      </button>

      <button onclick="speakAnswer()">
        🔊 Speak
      </button>

    </div>

  </div>

  <!-- ADSTERRA AD -->
  <div class="ad-box">

    <div class="ad-title">
      Advertisement
    </div>

    <script
      async="async"
      data-cfasync="false"
      src="https://pl31417071.profitableratecpmnetwork.com/639b1b8a48716eee23042aebff932ed7/invoke.js">
    </script>

    <div id="container-639b1b8a48716eee23042aebff932ed7"></div>

  </div>

  <div class="footer">
    Question AI • Educational Assistant
  </div>

</div>

<div class="toast" id="toast"></div>


<script>

let selectedSubject = "Auto";

let imageBase64 = "";
let imageMime = "";


/* LOAD SAVED KEY */

const savedKey =
  sessionStorage.getItem("gemini_api_key");

if(savedKey){

  document.getElementById("apiKey").value =
    savedKey;

}


/* TOAST */

function showToast(message){

  const toast =
    document.getElementById("toast");

  toast.innerText = message;

  toast.style.display = "block";

  setTimeout(function(){

    toast.style.display = "none";

  },2500);

}


/* SAVE API KEY */

function saveKey(){

  const key =
    document.getElementById("apiKey").value.trim();

  if(!key){

    showToast("API key paste karo");

    return;
  }

  sessionStorage.setItem(
    "gemini_api_key",
    key
  );

  showToast("API key save ho gayi ✓");

}


/* SUBJECT */

function selectSubject(button,subject){

  selectedSubject = subject;

  document
    .querySelectorAll(".subjects button")
    .forEach(function(btn){

      btn.classList.remove("active");

    });

  button.classList.add("active");

}


/* IMAGE UPLOAD */

document
  .getElementById("imageInput")
  .addEventListener("change",function(){

    const file = this.files[0];

    if(!file) return;

    const reader = new FileReader();

    reader.onload = function(e){

      const img = new Image();

      img.onload = function(){

        const canvas =
          document.createElement("canvas");

        let width = img.width;
        let height = img.height;

        const maxSize = 1600;

        if(width > maxSize){

          height =
            height * maxSize / width;

          width = maxSize;

        }

        if(height > maxSize){

          width =
            width * maxSize / height;

          height = maxSize;

        }

        canvas.width = width;
        canvas.height = height;

        const ctx =
          canvas.getContext("2d");

        ctx.drawImage(
          img,
          0,
          0,
          width,
          height
        );

        imageBase64 =
          canvas
            .toDataURL("image/jpeg",0.82)
            .split(",")[1];

        imageMime = "image/jpeg";

        const preview =
          document.getElementById("imagePreview");

        preview.src =
          "data:image/jpeg;base64," +
          imageBase64;

        preview.style.display = "block";

      };

      img.src = e.target.result;

    };

    reader.readAsDataURL(file);

  });


/* CLEAN AI ANSWER */

function cleanAIAnswer(text){

  return text

    .replace(/\$\$/g,"")
    .replace(/\$/g,"")

    .replace(/\*\*/g,"")
    .replace(/\*/g,"")

    .replace(/^#{1,6}\s*/gm,"")

    .replace(/```[a-zA-Z]*\n?/g,"")
    .replace(/```/g,"")

    .replace(/\\text\{([^}]*)\}/g,"$1")
    .replace(/\\mathrm\{([^}]*)\}/g,"$1")
    .replace(/\\mathbf\{([^}]*)\}/g,"$1")

    .replace(
      /\\frac\{([^}]*)\}\{([^}]*)\}/g,
      "$1/$2"
    )

    .replace(/\\quad/g," ")
    .replace(/\\,/g," ")
    .replace(/\\;/g," ")
    .replace(/\\!/g,"")

    .replace(/\\left/g,"")
    .replace(/\\right/g,"")

    .replace(/\\begin\{[^}]*\}/g,"")
    .replace(/\\end\{[^}]*\}/g,"")

    .replace(/[ \t]+/g," ")

    .replace(/\n{3,}/g,"\n\n")

    .trim();

}


/* SOLVE */

async function solveQuestion(){

  const key =
    document.getElementById("apiKey")
      .value.trim();

  if(!key){

    showToast("Pehle Gemini API key save karo");

    return;
  }

  const question =
    document.getElementById("question")
      .value.trim();

  if(!question && !imageBase64){

    showToast("Question ya image upload karo");

    return;
  }

  const language =
    document.getElementById("language")
      .value;

  const level =
    document.getElementById("level")
      .value;


  const instruction = `

You are Question AI, a helpful educational assistant.

Subject:
${selectedSubject}

Student level:
${level}

Answer language:
${language}

Rules:

1. Solve the student's question accurately.
2. If it is a maths or science problem, show the method step by step.
3. Explain formulas clearly.
4. Keep the explanation easy to understand.
5. If an image is provided, carefully read the question from the image.
6. Do not invent information that is not visible in the image.
7. Give the final answer clearly at the end.
8. For Hindi use simple Hindi.
9. For Hinglish use easy Hindi written with English letters.
10. Do not unnecessarily make the answer extremely long.

11. Use plain text only.
12. NEVER use $ or $$.
13. NEVER use LaTeX.
14. NEVER use Markdown bold using **.
15. NEVER use Markdown headings using #.
16. NEVER use \\frac, \\quad, \\begin or \\end.
17. Write mathematical calculations in simple plain text.
18. Example: 23 + 2 = 25.
19. Do not put the answer inside a code block.

Student question:
${question || "Please solve the question shown in the uploaded image."}

`;


  const parts = [

    {
      text: instruction
    }

  ];


  if(imageBase64){

    parts.push({

      inline_data:{

        mime_type:imageMime,

        data:imageBase64

      }

    });

  }


  const loading =
    document.getElementById("loading");

  const solveBtn =
    document.getElementById("solveBtn");

  loading.style.display = "block";

  solveBtn.disabled = true;


  try{

    const response =
      await fetch(
        "https://generativelanguage.googleapis.com/v1beta/models/gemini-3.8-flash:generateContent",
        {

          method:"POST",

          headers:{

            "Content-Type":
              "application/json",

            "x-goog-api-key":
              key

          },

          body:JSON.stringify({

            contents:[

              {

                role:"user",

                parts:parts

              }

            ]

          })

        }
      );


    const data =
      await response.json();


    if(!response.ok){

      throw new Error(

        data?.error?.message ||
        "API request failed"

      );

    }


    let result = "";


    if(
      data.candidates &&
      data.candidates[0] &&
      data.candidates[0].content
    ){

      const responseParts =
        data.candidates[0].content.parts || [];


      responseParts.forEach(function(part){

        if(part.text){

          result +=
            part.text;

        }

      });

    }


    if(!result){

      throw new Error(
        "AI ne answer return nahi kiya."
      );

    }


    const cleanResult =
      cleanAIAnswer(result);


    document.getElementById("answer").innerText =
      cleanResult;

    document.getElementById("answerCard")
      .style.display = "block";


    showToast("Answer ready ✓");


  }catch(error){

    document.getElementById("answer").innerText =
      "Error: " + error.message;

    document.getElementById("answerCard")
      .style.display = "block";

    showToast("Answer nahi mila");


  }finally{

    loading.style.display = "none";

    solveBtn.disabled = false;

  }

}


/* COPY */

async function copyAnswer(){

  const text =
    document.getElementById("answer")
      .innerText;

  if(!text) return;


  try{

    await navigator.clipboard.writeText(text);

    showToast("Answer copied ✓");

  }catch(e){

    showToast("Copy nahi ho paya");

  }

}


/* SPEECH */

function speakAnswer(){

  const text =
    document.getElementById("answer")
      .innerText;

  if(!text) return;


  speechSynthesis.cancel();


  const speech =
    new SpeechSynthesisUtterance(text);


  const language =
    document.getElementById("language")
      .value;


  if(language === "Hindi"){

    speech.lang = "hi-IN";

  }else{

    speech.lang = "en-IN";

  }


  speech.rate = 0.9;

  speechSynthesis.speak(speech);

}


/* CLEAR */

function clearQuestion(){

  document.getElementById("question")
    .value = "";

  document.getElementById("imageInput")
    .value = "";

  document.getElementById("imagePreview")
    .style.display = "none";

  imageBase64 = "";

  imageMime = "";

  document.getElementById("answerCard")
    .style.display = "none";

}


/* PASTE */

async function pasteQuestion(){

  try{

    const text =
      await navigator.clipboard.readText();

    document.getElementById("question")
      .value = text;

    showToast("Question pasted ✓");

  }catch(e){

    showToast(
      "Paste permission allow karo"
    );

  }

}

</script>

</body>
</html>
